<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Online Training Portal registration</h2>
    <form action="" method="get">
        Email: <input type="email"><br><br>

        Website: <input type="url"><br><br>

        Age: <input type="number" min="18" max="60"><br><br>

        Skill Level: <input type="range" min="1" max="10"><br><br>

        Favourite Color: <input type="color"><br><br>

        Course Start Date: <input type="date"><br><br>

        Meeting Time: <input type="time"><br><br>

        Search Course: <input type="search"><br><br>

        phone: <input type="tel"><br><br>

        Month: <input type="month"><br><br>

        Date &Time: <input type="datetime-local"><br><br>

        <input type="submit">
    </form>
</body>
</html>
