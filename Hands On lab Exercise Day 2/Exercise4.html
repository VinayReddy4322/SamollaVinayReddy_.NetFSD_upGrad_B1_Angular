<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Select Programming Language:</h2>
    <input type="text" list="languages" placeholder="Choose or Type Language">
    <datalist id="languages">
        <option value="HTML"></option>
        <option value="CSS"></option>
        <option value="JS"></option>
        <option value="Python"></option>
        <option value="Java"></option>
        <option value=".NET"></option>
        <option value="C++"></option>
        <option value="React"></option>
    </datalist>
    <br><br>

    <h2>Select City</h2>
    <input type="text" list="city" placeholder="Choose or type city">
    <datalist id="city">
        <option value="Hyderabad"></option>
        <option value="Mumabi"></option>
        <option value="Chennai"></option>
        <option value="Delhi"></option>
        <option value="Kolkata"></option>
        <option value="Banglore"></option>
        <option value="Pune"></option>
        <option value="Vijayawada"></option>
    </datalist>
</body>
</html>
