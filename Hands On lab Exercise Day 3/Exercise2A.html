<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p{
            color: blue;
        }
        .container{
            background: yellow;
        }
        #box{
            border: red;
        }
        h1,button{
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }
        *{
            margin: default;
        }
    </style>
</head>
<body>
    <h1 id="head">CSS Class Selector</h1>
    <p></p>
    <p class="container"></p>
    <p id="box"></p>
    <div class="container">
    <button>Button 1</button>
    <button>button 2</button>
    </div>
</body>
</html>
