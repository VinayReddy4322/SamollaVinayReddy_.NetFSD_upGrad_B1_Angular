<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box1{
            box-sizing: content-box;
            width: 300px;
            padding: 20px;
            border: 5px solid;
            margin-left: 30%;
            margin-top: 20%;
            background-color: bisque;
        }
        .box2{
            box-sizing: border-box;
            width: 300px;
            padding: 20px;
            border: 5px solid;
            margin-left: 25%;
            background-color: aqua;
        }
    </style>
</head>
<body>
    <div class="box1">Content Box</div><br>
    <div class="box2">Border Box</div>
</body>
</html>
